<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1100" viewBox="0 0 800 1100">
  <!-- PLANTILLA DE CARTEL — edita los textos marcados y exporta como PNG/JPG -->
  <rect width="800" height="1100" fill="#0d0d0d"/>
  <rect x="0" y="0" width="800" height="28" fill="#e11d48"/>

  <text x="60" y="110" fill="#ffffff" fill-opacity="0.55" font-family="Arial, sans-serif" font-size="22" font-weight="bold" letter-spacing="6">DEBAROCK KOLEKTIBOA</text>

  <!-- TÍTULO: edita aquí -->
  <text x="60" y="290" fill="#FFE600" font-family="Arial Black, Arial, sans-serif" font-size="110" font-weight="900">JAM</text>
  <text x="60" y="410" fill="#FFE600" font-family="Arial Black, Arial, sans-serif" font-size="110" font-weight="900">SESSION</text>

  <rect x="60" y="470" width="220" height="14" fill="#e11d48"/>

